# Checks, builds and publishes the package to npm when a release is created.

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  contents: read
  # Lets pnpm publish through npm trusted publishing instead of a token.
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@lts
          require-lockfile: true
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm publish --no-git-checks
